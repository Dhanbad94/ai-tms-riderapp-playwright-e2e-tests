name: Rider Tests — Staging

on:
  # Scheduled runs
  schedule:
    # Smoke tests: Mon-Fri 6 AM UTC
    - cron: '0 6 * * 1-5'
    # Full regression: Tue & Thu 8 AM UTC
    - cron: '0 8 * * 2,4'

  # Manual trigger
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type to run'
        required: false
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression
          - sanity
          - safe
          - all

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  CI: true
  NODE_ENV: test
  ENV: staging

jobs:
  rider-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    outputs:
      total: ${{ steps.parse.outputs.total }}
      passed: ${{ steps.parse.outputs.passed }}
      failed: ${{ steps.parse.outputs.failed }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Determine test type
        id: test-type
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            HOUR=$(date -u +%H)
            if [ "$HOUR" == "06" ]; then
              TYPE="smoke"
            else
              TYPE="regression"
            fi
          else
            TYPE="${{ github.event.inputs.test_type || 'smoke' }}"
          fi
          echo "type=$TYPE" >> $GITHUB_OUTPUT
          echo "Running: $TYPE tests"

      - name: Run rider tests
        run: |
          TYPE="${{ steps.test-type.outputs.type }}"
          if [ "$TYPE" == "all" ]; then
            ./run-tests -e staging -u all --bc
          else
            ./run-tests -e staging --tag @${TYPE} --bc
          fi

      - name: Generate dashboard report
        if: always()
        run: npx tsx helpers/generate-report.ts || true

      - name: Parse results
        id: parse
        if: always()
        run: |
          if [ -f test-results.json ]; then
            TOTAL=$(python3 -c "import json; d=json.load(open('test-results.json')); s=d['stats']; print(s['expected']+s['unexpected']+s['skipped'])")
            PASSED=$(python3 -c "import json; d=json.load(open('test-results.json')); print(d['stats']['expected'])")
            FAILED=$(python3 -c "import json; d=json.load(open('test-results.json')); print(d['stats']['unexpected'])")
            echo "total=$TOTAL" >> $GITHUB_OUTPUT
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
          fi

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rider-report-${{ steps.test-type.outputs.type }}
          path: |
            playwright-report/
            dashboard-report.html
            results.xml
          retention-days: 14

      - name: Upload dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ steps.test-type.outputs.type }}
          path: dashboard-report.html
          retention-days: 30

  notify:
    needs: rider-tests
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "Slack webhook not configured, skipping"
            exit 0
          fi

          RESULT="${{ needs.rider-tests.result }}"
          TOTAL="${{ needs.rider-tests.outputs.total }}"
          PASSED="${{ needs.rider-tests.outputs.passed }}"
          FAILED="${{ needs.rider-tests.outputs.failed }}"

          if [ "$RESULT" == "success" ]; then
            EMOJI="✅"; COLOR="#36a64f"; HEADER="Rider Tests Passed"
          else
            EMOJI="❌"; COLOR="#dc3545"; HEADER="Rider Tests Failed"
          fi

          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "{
              \"attachments\": [{
                \"color\": \"$COLOR\",
                \"blocks\": [
                  {\"type\":\"header\",\"text\":{\"type\":\"plain_text\",\"text\":\"$EMOJI $HEADER\",\"emoji\":true}},
                  {\"type\":\"section\",\"fields\":[
                    {\"type\":\"mrkdwn\",\"text\":\"*Environment:*\nStaging\"},
                    {\"type\":\"mrkdwn\",\"text\":\"*Test Type:*\n${{ github.event.inputs.test_type || 'scheduled' }}\"},
                    {\"type\":\"mrkdwn\",\"text\":\"*Total:* $TOTAL\"},
                    {\"type\":\"mrkdwn\",\"text\":\"*Passed:* $PASSED | *Failed:* $FAILED\"}
                  ]}
                ]
              }]
            }"
        continue-on-error: true
