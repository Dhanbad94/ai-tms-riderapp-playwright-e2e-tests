name: Rider Tests — PR Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
          - preproduction
          - production
      test_type:
        description: 'Test type to run'
        required: false
        default: 'smoke'
        type: choice
        options:
          - smoke
          - sanity
          - regression
          - safe
          - all

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  CI: true
  NODE_ENV: test

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the dashboard to the gh-pages branch
      checks: write
      pull-requests: write
    outputs:
      total: ${{ steps.parse.outputs.total }}
      passed: ${{ steps.parse.outputs.passed }}
      failed: ${{ steps.parse.outputs.failed }}
      report_url: ${{ steps.report-url.outputs.url }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Determine test config
        id: config
        run: |
          ENV="${{ github.event.inputs.environment || 'staging' }}"
          TYPE="${{ github.event.inputs.test_type || 'smoke' }}"

          # For PRs, always run smoke tests on staging
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            ENV="staging"
            TYPE="smoke"
          fi

          echo "env=$ENV" >> $GITHUB_OUTPUT
          echo "type=$TYPE" >> $GITHUB_OUTPUT
          echo "Running $TYPE tests on $ENV"

      - name: Run rider tests
        env:
          ENV: ${{ steps.config.outputs.env }}
        run: |
          TYPE="${{ steps.config.outputs.type }}"
          # Regression and "all" runs include @creates-ride tests which submit real rides.
          # Run them serially (workers=1) so concurrent submissions don't trip staging's rate limiter.
          if [ "$TYPE" == "all" ]; then
            ./run-tests -e $ENV -u all --bc --workers 1
          elif [ "$TYPE" == "regression" ]; then
            ./run-tests -e $ENV --tag @${TYPE} --bc --workers 1
          else
            ./run-tests -e $ENV --tag @${TYPE} --bc
          fi

      - name: Generate dashboard report
        if: always()
        run: npx tsx helpers/generate-report.ts || true

      # Stage the custom dashboard (+ full Playwright report for drill-down) into a
      # per-run folder so each run gets its own URL and history is preserved.
      - name: Stage report for Pages
        id: stage
        if: always()
        run: |
          if [ -f dashboard-report.html ]; then
            mkdir -p public
            cp dashboard-report.html public/index.html
            cp dashboard-report.html public/dashboard-report.html
            [ -d playwright-report ] && cp -r playwright-report public/playwright-report || true
            echo "staged=true" >> $GITHUB_OUTPUT
          else
            echo "No dashboard-report.html to publish"
            echo "staged=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish report to GitHub Pages
        id: pages
        if: always() && steps.stage.outputs.staged == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          destination_dir: ${{ github.run_id }}
          keep_files: true

      # Build the CTA target. Use the rendered Pages URL when publishing succeeded,
      # otherwise fall back to the Actions run page so the button never dead-links.
      - name: Resolve report URL
        id: report-url
        if: always()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ steps.pages.outcome }}" == "success" ]; then
            OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            REPO="${{ github.event.repository.name }}"
            echo "url=https://${OWNER_LC}.github.io/${REPO}/${{ github.run_id }}/dashboard-report.html" >> $GITHUB_OUTPUT
          else
            echo "url=$RUN_URL" >> $GITHUB_OUTPUT
          fi

      - name: Parse results
        id: parse
        if: always()
        run: |
          if [ -f test-results.json ]; then
            TOTAL=$(python3 -c "import json; d=json.load(open('test-results.json')); s=d['stats']; print(s['expected']+s['unexpected']+s['skipped'])")
            PASSED=$(python3 -c "import json; d=json.load(open('test-results.json')); print(d['stats']['expected'])")
            FAILED=$(python3 -c "import json; d=json.load(open('test-results.json')); print(d['stats']['unexpected'])")
            echo "total=$TOTAL" >> $GITHUB_OUTPUT
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
          fi

      - name: Upload reports
        if: always()
        # Artifact upload is a reporting convenience, not a test outcome. Never let
        # an upload failure (e.g. artifact storage quota exhausted) fail the build.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: rider-report-${{ steps.config.outputs.env }}-${{ steps.config.outputs.type }}
          path: |
            playwright-report/
            dashboard-report.html
            results.xml
          retention-days: 7

      - name: Publish JUnit results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: results.xml
          check_name: Rider Test Results
          comment_mode: always
          github_token: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Slack notification
        run: |
          if [ -z "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "Slack webhook not configured, skipping"
            exit 0
          fi

          RESULT="${{ needs.test.result }}"
          TOTAL="${{ needs.test.outputs.total }}"
          PASSED="${{ needs.test.outputs.passed }}"
          FAILED="${{ needs.test.outputs.failed }}"
          REPORT_URL="${{ needs.test.outputs.report_url }}"
          # Fallback so the CTA is always present even if report_url didn't resolve.
          [ -z "$REPORT_URL" ] && REPORT_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$RESULT" == "success" ]; then
            EMOJI="✅"; COLOR="#36a64f"; HEADER="Rider Tests Passed"
          else
            EMOJI="❌"; COLOR="#dc3545"; HEADER="Rider Tests Failed"
          fi

          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            --data "{
              \"attachments\": [{
                \"color\": \"$COLOR\",
                \"blocks\": [
                  {\"type\":\"header\",\"text\":{\"type\":\"plain_text\",\"text\":\"$EMOJI $HEADER\",\"emoji\":true}},
                  {\"type\":\"section\",\"fields\":[
                    {\"type\":\"mrkdwn\",\"text\":\"*Environment:*\n${{ github.event.inputs.environment || 'staging' }}\"},
                    {\"type\":\"mrkdwn\",\"text\":\"*Type:*\n${{ github.event.inputs.test_type || 'smoke' }}\"},
                    {\"type\":\"mrkdwn\",\"text\":\"*Total:* $TOTAL | *Passed:* $PASSED | *Failed:* $FAILED\"},
                    {\"type\":\"mrkdwn\",\"text\":\"*Branch:*\n${{ github.ref_name }}\"}
                  ]},
                  {\"type\":\"actions\",\"elements\":[{
                    \"type\":\"button\",
                    \"text\":{\"type\":\"plain_text\",\"text\":\"View Report Results\",\"emoji\":true},
                    \"url\":\"$REPORT_URL\"
                  }]}
                ]
              }]
            }"
        continue-on-error: true
