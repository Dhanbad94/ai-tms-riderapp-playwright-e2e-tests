name: Rider Tests — PR Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
          - preproduction
          - production
      test_type:
        description: 'Test type to run'
        required: false
        default: 'smoke'
        type: choice
        options:
          - smoke
          - sanity
          - regression
          - safe
          - all

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  CI: true
  NODE_ENV: test

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    outputs:
      total: ${{ steps.parse.outputs.total }}
      passed: ${{ steps.parse.outputs.passed }}
      failed: ${{ steps.parse.outputs.failed }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Determine test config
        id: config
        run: |
          ENV="${{ github.event.inputs.environment || 'staging' }}"
          TYPE="${{ github.event.inputs.test_type || 'smoke' }}"

          # For PRs, always run smoke tests on staging
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            ENV="staging"
            TYPE="smoke"
          fi

          echo "env=$ENV" >> $GITHUB_OUTPUT
          echo "type=$TYPE" >> $GITHUB_OUTPUT
          echo "Running $TYPE tests on $ENV"

      - name: Run rider tests
        env:
          ENV: ${{ steps.config.outputs.env }}
        run: |
          TYPE="${{ steps.config.outputs.type }}"
          # Regression and "all" runs include @creates-ride tests which submit real rides.
          # Run them serially (workers=1) so concurrent submissions don't trip staging's rate limiter.
          if [ "$TYPE" == "all" ]; then
            ./run-tests -e $ENV -u all --bc --workers 1
          elif [ "$TYPE" == "regression" ]; then
            ./run-tests -e $ENV --tag @${TYPE} --bc --workers 1
          else
            ./run-tests -e $ENV --tag @${TYPE} --bc
          fi

      - name: Generate dashboard report
        if: always()
        run: npx tsx helpers/generate-report.ts || true

      - name: Parse results
        id: parse
        if: always()
        run: |
          if [ -f test-results.json ]; then
            TOTAL=$(python3 -c "import json; d=json.load(open('test-results.json')); s=d['stats']; print(s['expected']+s['unexpected']+s['skipped'])")
            PASSED=$(python3 -c "import json; d=json.load(open('test-results.json')); print(d['stats']['expected'])")
            FAILED=$(python3 -c "import json; d=json.load(open('test-results.json')); print(d['stats']['unexpected'])")
            echo "total=$TOTAL" >> $GITHUB_OUTPUT
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rider-report-${{ steps.config.outputs.env }}-${{ steps.config.outputs.type }}
          path: |
            playwright-report/
            dashboard-report.html
            results.xml
          retention-days: 14

      - name: Publish JUnit results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: results.xml
          check_name: Rider Test Results
          comment_mode: always
          github_token: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Slack notification
        run: |
          if [ -z "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "Slack webhook not configured, skipping"
            exit 0
          fi

          RESULT="${{ needs.test.result }}"
          TOTAL="${{ needs.test.outputs.total }}"
          PASSED="${{ needs.test.outputs.passed }}"
          FAILED="${{ needs.test.outputs.failed }}"

          if [ "$RESULT" == "success" ]; then
            EMOJI="✅"; COLOR="#36a64f"; HEADER="Rider Tests Passed"
          else
            EMOJI="❌"; COLOR="#dc3545"; HEADER="Rider Tests Failed"
          fi

          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            --data "{
              \"attachments\": [{
                \"color\": \"$COLOR\",
                \"blocks\": [
                  {\"type\":\"header\",\"text\":{\"type\":\"plain_text\",\"text\":\"$EMOJI $HEADER\",\"emoji\":true}},
                  {\"type\":\"section\",\"fields\":[
                    {\"type\":\"mrkdwn\",\"text\":\"*Environment:*\n${{ github.event.inputs.environment || 'staging' }}\"},
                    {\"type\":\"mrkdwn\",\"text\":\"*Type:*\n${{ github.event.inputs.test_type || 'smoke' }}\"},
                    {\"type\":\"mrkdwn\",\"text\":\"*Total:* $TOTAL | *Passed:* $PASSED | *Failed:* $FAILED\"},
                    {\"type\":\"mrkdwn\",\"text\":\"*Branch:*\n${{ github.ref_name }}\"}
                  ]},
                  {\"type\":\"actions\",\"elements\":[{
                    \"type\":\"button\",
                    \"text\":{\"type\":\"plain_text\",\"text\":\"View Results\"},
                    \"url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
                  }]}
                ]
              }]
            }"
        continue-on-error: true
